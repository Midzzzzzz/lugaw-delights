<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lugaw Delights – Owner</title>
<meta name="robots" content="noindex">
<meta name="app-role" content="owner">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.narrow{max-width:460px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.custom{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.custom input{width:auto;padding:5px 8px;font-size:.88rem}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
@media (max-width:400px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel h2{font-size:1.2rem;color:var(--brand-deep);margin-bottom:10px}
.panel .sub{font-size:.8rem;color:var(--muted);margin:-8px 0 10px}
/* Ranked bars: one row per entity, the number is always written out, the bar only helps compare */
.rank{display:grid;gap:3px;padding:5px 0}
.rrow{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.rrow .rnum{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.rrow .rnum b{color:var(--fg)}
.track{height:10px}
.bar{height:10px;background:var(--brand);border-radius:0 4px 4px 0;min-width:2px}
.tablewrap{overflow-x:auto;margin-top:10px}
table.orders{width:100%;border-collapse:collapse;font-size:.88rem}
table.orders th{text-align:left;color:var(--muted);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.orders td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.orders tr.row{cursor:pointer}
table.orders tr.row:hover td{background:var(--sunk)}
table.orders td.n,table.orders th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail td{background:var(--sunk)}
.search{max-width:220px}
/* Menu editor */
.msec{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;display:grid;gap:8px}
.mhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mhead input[data-f="name"]{font-family:var(--display);font-weight:800;font-size:1.05rem;flex:1;min-width:180px}
.cats2{display:flex;flex-wrap:wrap;gap:6px}
.mitem{border-top:1px dashed var(--line);padding:6px 0}
.mrow{display:grid;grid-template-columns:64px minmax(150px,2fr) 90px minmax(140px,2fr) auto auto auto;gap:6px;align-items:center}
@media (max-width:760px){.mrow{grid-template-columns:64px 1fr 90px}.mrow input[data-f="inc"]{grid-column:2/-1}.mrow>.chk,.mrow>[data-mact="recipe"],.mrow>.mbtns{grid-column:2/-1;justify-self:start}}
.mph{display:grid;gap:2px;justify-items:center}
.mph img{width:60px;height:60px;object-fit:cover;border-radius:10px;display:block}
.mph button{border:0;background:transparent;color:var(--brand-deep);font-size:.72rem;font-weight:700;cursor:pointer;padding:0}
.mph .addph{width:60px;height:60px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.78rem}
.srows{display:grid;gap:4px;margin-top:8px;max-height:320px;overflow-y:auto}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.sstep{display:inline-flex;align-items:center;gap:8px}
.sstep button{width:34px;height:30px;border:2px solid var(--brand);border-radius:99px;background:transparent;color:var(--brand);font-weight:800;cursor:pointer}
.sstep button:disabled{opacity:.35}
.rsum{font-size:.8rem;margin-top:3px}
.recipe{background:var(--sunk);border-radius:10px;padding:10px;margin-top:6px;display:grid;gap:6px}
.rrow2{display:grid;grid-template-columns:minmax(120px,1fr) 100px auto auto;gap:6px;align-items:center;max-width:520px}
.rrow2 button{border:2px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:700}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:.85rem;font-weight:700;white-space:nowrap;cursor:pointer}
.chk input{width:auto}
.mbtns{display:flex;gap:4px}
.mbtns button,.mhead button.mini{border:2px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:700}
.msave{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:2px solid var(--line);margin-top:12px;z-index:3}
/* Inventory */
table.inv{width:100%;border-collapse:collapse;font-size:.9rem}
table.inv th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--line)}
table.inv td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.inv td.n,table.inv th.n{text-align:right;font-variant-numeric:tabular-nums}
table.inv tr.low td{background:var(--warn-bg)}
table.inv tr.out td{background:var(--sunk);color:var(--brand-deep);font-weight:700}
table.inv tr.sec td{font-weight:800;color:var(--brand-deep);padding-top:12px}
table.inv input{width:90px;text-align:right;padding:5px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="logo.jpg" alt="Lugaw Delights logo">
    <div class="who"><h1>Owner Dashboard</h1><p class="tag">Sales, sellers, riders and every order.</p></div>
    <button class="btn ghost small" id="signOut" hidden>Sign out</button>
  </header>
  <div id="setup"></div>

  <form class="stack card narrow" id="loginForm" novalidate hidden>
    <h2 style="color:var(--brand)">Owner sign in</h2>
    <label class="f" for="l-email">Email<input id="l-email" type="email" autocomplete="email"></label>
    <label class="f" for="l-pass">Password<input id="l-pass" type="password" autocomplete="current-password"></label>
    <p class="err" id="l-err" hidden></p>
    <div class="btnrow"><button class="btn" type="submit">Sign in</button>
      <button class="btn ghost small" type="button" id="create">Create owner account</button></div>
    <p class="muted" style="font-size:.85rem;margin:0">New owner? Type the email and password you want, tap <b>Create owner account</b>, then follow step 7 of the setup guide.</p>
  </form>

  <div class="card narrow" id="notAdmin" hidden></div>

  <div id="dash" hidden>
    <div class="card toolbar" id="ranges"></div>
    <div class="stats">
      <div class="stat"><b id="sSales">₱0</b><span>Sales</span></div>
      <div class="stat"><b id="sOrders">0</b><span>Completed orders</span></div>
      <div class="stat"><b id="sAvg">₱0</b><span>Average order</span></div>
      <div class="stat"><b id="sFees">₱0</b><span>Rider fees</span></div>
      <div class="stat"><b id="sOpen">0</b><span>In progress</span></div>
      <div class="stat"><b id="sCancel">0</b><span>Cancelled</span></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<script type="module">
import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, updateDoc, onSnapshot, collection, query, where, orderBy, limit, Timestamp, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { CONTRACT_VERSION, agreementHTML } from "./contract.js";
import { readLoyverse } from "./loyverse.js";
import { auth, db, isConfigured, ITEMS, MENU_SECTIONS, applyMenu, ingredientsLeft, soldOutFrom, calcTotals, orderCode, compressPhoto, MAX_LINES, MAX_QTY, ACTIVE, peso, esc, STATUS, statusLabel, shopAmount, itemsHTML, mapsLink, phoneKey, telLink, loadProofs, proofsHTML, DELIVERY_ZONES, defaultFees, hasPayout, payoutText, friendlyError, setupNotice } from "./common.js";

const $=s=>document.querySelector(s);
let ledger=[], ledgerErr="", agreements={}, store={}, deliveryFees=null, feesSaved=false, feesErr="", reports=[], reportsErr="", subs=[], ordersSub=null, orders=[], sellers=[], kitchen=[], riders=[], contacts={}, open=null, teamErr="";
let range="today", tab="sales", filter="all", search="";
const show=v=>["loginForm","notAdmin","dash"].forEach(id=>$("#"+id).hidden=id!==v);
$("#setup").innerHTML=setupNotice();

if(isConfigured) onAuthStateChanged(auth, async u=>{
  subs.forEach(f=>f()); subs=[]; ordersSub?.(); ordersSub=null;
  const me=u && !u.isAnonymous ? u : null;
  $("#signOut").hidden=!me;
  if(!me) return show("loginForm");
  let admin=false;
  try{ admin=(await getDoc(doc(db,"admins",me.uid))).exists(); }catch(_){}
  if(!admin){
    show("notAdmin");
    // Seller and rider accounts get a plain refusal; only a brand-new account sees the owner setup steps
    let staffAccount=false;
    try{ staffAccount=(await getDoc(doc(db,"sellers",me.uid))).exists() || (await getDoc(doc(db,"kitchen",me.uid))).exists() || (await getDoc(doc(db,"riders",me.uid))).exists(); }catch(_){}
    if(staffAccount){
      $("#notAdmin").innerHTML=`<h2 style="color:var(--brand)">Owner only</h2>
        <p>This page is for the shop owner. Please sign out.</p>`;
      return;
    }
    $("#notAdmin").innerHTML=`<h2 style="color:var(--brand)">One more step</h2>
      <p>Signed in as <b>${esc(me.email)}</b>, but this account isn't an owner yet. In the Firebase console, add a document to the
      <code>admins</code> collection with this ID (setup guide, step 7):</p>
      <p><code style="font-size:1rem;user-select:all;overflow-wrap:anywhere">${esc(me.uid)}</code></p>
      <div class="btnrow"><button class="btn small" id="copyUid">Copy ID</button><button class="btn ghost small" onclick="location.reload()">I've done it, reload</button></div>`;
    $("#copyUid").onclick=()=>navigator.clipboard?.writeText(me.uid).then(()=>$("#copyUid").textContent="Copied").catch(()=>{});
    return;
  }
  show("dash"); start();
});
$("#signOut").onclick=()=>signOut(auth);
const lerr=m=>{ $("#l-err").textContent=m||""; $("#l-err").hidden=!m; };
$("#loginForm").onsubmit=async e=>{ e.preventDefault(); lerr();
  try{ await signInWithEmailAndPassword(auth,$("#l-email").value.trim(),$("#l-pass").value); }catch(x){ lerr(friendlyError(x)); } };
$("#create").onclick=async()=>{ lerr();
  try{ await createUserWithEmailAndPassword(auth,$("#l-email").value.trim(),$("#l-pass").value); }catch(x){ lerr(friendlyError(x)); } };

function start(){
  // Savings book: money set aside from sales, and expenses paid from it (owner only)
  subs.push(onSnapshot(query(collection(db,"ledger"),orderBy("date","desc")), s=>{
    // newest first: by date, then by when it was recorded
    const t=e=>e.createdAt?.toMillis?.()??Infinity;
    ledger=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date===b.date?t(b)-t(a):(a.date<b.date?1:-1)); ledgerErr=""; if(tab==="savings") render();
  }, e=>{ ledgerErr="Couldn't load savings: "+friendlyError(e)+" If you just updated the app, publish the new security rules in Firebase."; if(tab==="savings") render(); }));
  subs.push(onSnapshot(collection(db,"sellers"), s=>{ sellers=s.docs.map(d=>({id:d.id,...d.data()})); teamErr=""; render(); }, e=>{ teamErr="Couldn't load sellers: "+friendlyError(e)+" If you just updated the app, publish the new security rules in Firebase."; render(); }));
  subs.push(onSnapshot(collection(db,"kitchen"), s=>{ kitchen=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  subs.push(onSnapshot(collection(db,"riders"), s=>{ riders=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  // Signed rider agreements, by rider id
  subs.push(onSnapshot(collection(db,"agreements"), s=>{ agreements={}; s.docs.forEach(d=>agreements[d.id]=d.data()); render(); }, ()=>{}));
  subs.push(onSnapshot(query(collection(db,"reports"),orderBy("createdAt","desc"),limit(200)), s=>{ reports=s.docs.map(d=>({id:d.id,...d.data()})); reportsErr=""; render(); },
    e=>{ reportsErr="Couldn't load reports: "+friendlyError(e)+" If you just updated the app, publish the new security rules in Firebase."; render(); }));
  // Don't redraw the settings tab while the owner is typing in it
  const editing=()=>tab==="settings" && document.activeElement?.closest?.("#view") && /INPUT|SELECT/.test(document.activeElement.tagName);
  subs.push(onSnapshot(doc(db,"settings","store"), s=>{ store=s.exists()?s.data():{}; if(tab==="settings" && !editing()) render(); }, ()=>{}));
  // Delivery fees per barangay. The first time, save the starting fees from config.js.
  subs.push(onSnapshot(doc(db,"settings","delivery"), s=>{
    if(!s.exists()){
      // Not saved yet: show the starting fees and try to save them; any error is shown on Shop settings
      deliveryFees=defaultFees(); feesSaved=false; if(tab==="settings" && !editing()) render();
      setDoc(doc(db,"settings","delivery"),{fees:defaultFees()}).catch(x=>{ feesErr="Couldn't save the delivery fees: "+friendlyError(x)+" Check that the latest security rules are published in Firebase, then tap Save delivery fees."; if(tab==="settings") render(); });
      return;
    }
    deliveryFees=s.data().fees||{}; feesSaved=true; feesErr=""; if(tab==="settings" && !editing()) render();
  }, x=>{ feesErr="Couldn't load the delivery fees: "+friendlyError(x); if(tab==="settings") render(); }));
  // Cashier shifts, newest first
  subs.push(onSnapshot(query(collection(db,"shifts"),orderBy("openedAt","desc"),limit(90)), s=>{
    allShifts=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})})); shiftsErr=""; render();
  }, e=>{ shiftsErr="Couldn't load shifts: "+friendlyError(e)+" If you just updated the app, publish the new security rules in Firebase."; if(tab==="shifts") render(); }));
  // The owner's menu (settings/menu) and inventory counts
  // Saved menu changes (recipes, prices) count right away, without a refresh
  subs.push(onSnapshot(doc(db,"settings","menu"), s=>{
    menuDoc=s.exists()?s.data():null; if(menuDoc) applyMenu(menuDoc.sections);
    const open=openCount(); if(open && invKey.startsWith(open.id+":")) publishStock(ingredientsLeft(open,invOrders));
    if(tab==="menu"||tab==="inventory") render();
  }, ()=>{}));
  subs.push(onSnapshot(collection(db,"menuPhotos"), s=>{ photos={}; s.docs.forEach(d=>photos[d.id]=d.data().photo); if(tab==="menu") render(); }, ()=>{}));
  subs.push(onSnapshot(doc(db,"settings","ingredients"), s=>{ ingDoc=s.exists()?s.data():null; if(tab==="menu"||tab==="inventory") render(); }, ()=>{}));
  subs.push(onSnapshot(query(collection(db,"inventory"),orderBy("since","desc"),limit(30)), s=>{
    counts=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})})); countsErr=""; if(tab==="inventory") render();
  }, e=>{ countsErr="Couldn't load inventory: "+friendlyError(e)+" If you just updated the app, publish the new security rules in Firebase."; if(tab==="inventory") render(); }));
  renderRanges(); watchOrders();
}

// ---------- Date range ----------
const RANGES=[["today","Today"],["yesterday","Yesterday"],["week","Last 7 days"],["month","This month"],["custom","Custom"]];
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayStart=d=>{ const x=new Date(d); x.setHours(0,0,0,0); return x; };
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rangeDates(){
  const t=dayStart(new Date());
  if(range==="yesterday") return [addDays(t,-1),t];
  if(range==="week") return [addDays(t,-6),addDays(t,1)];
  if(range==="month") return [new Date(t.getFullYear(),t.getMonth(),1),addDays(t,1)];
  if(range==="custom"){
    const f=$("#from")?.value, to=$("#to")?.value;
    if(f && to){ const a=dayStart(new Date(f+"T00:00")), b=addDays(dayStart(new Date(to+"T00:00")),1); if(b>a) return [a,b]; }
  }
  return [t,addDays(t,1)];
}
function renderRanges(){
  const [a,b]=rangeDates();
  $("#ranges").innerHTML=RANGES.map(([k,l])=>`<button class="chip ${range===k?"on":""}" data-range="${k}">${l}</button>`).join("")
    + `<span class="custom" ${range==="custom"?"":"hidden"}><input type="date" id="from" value="${ymd(a)}" aria-label="From">
       <span class="muted">to</span><input type="date" id="to" value="${ymd(addDays(b,-1))}" aria-label="To"></span>`;
}
$("#ranges").addEventListener("click",e=>{ const b=e.target.closest("[data-range]"); if(!b) return; range=b.dataset.range; renderRanges(); watchOrders(); });
$("#ranges").addEventListener("change",e=>{ if(e.target.matches("#from,#to")) watchOrders(); });
setInterval(()=>{ if(ordersSub && range==="today" && rangeDates()[0].getTime()!==watching) watchOrders(); }, 60000); // roll over at midnight

// Live list of every order placed in the chosen range
let watching=0;
function watchOrders(){
  ordersSub?.(); const [a,b]=rangeDates(); watching=a.getTime(); open=null;
  ordersSub=onSnapshot(query(collection(db,"orders"),where("createdAt",">=",Timestamp.fromDate(a)),where("createdAt","<",Timestamp.fromDate(b)),orderBy("createdAt","desc")),
    s=>{ orders=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    e=>{ $("#view").innerHTML=`<p class="empty">${esc(friendlyError(e))}</p>`; });
}

// ---------- Numbers ----------
const DONE=["delivered","completed"];
const isDone=o=>DONE.includes(o.status);
function group(list,keyFn,labelFn,valFn){
  const m=new Map();
  list.forEach(o=>{ const k=keyFn(o); const r=m.get(k)||{key:k,label:labelFn(o),count:0,value:0}; r.count++; r.value+=valFn(o); m.set(k,r); });
  return [...m.values()].sort((x,y)=>y.value-x.value||y.count-x.count);
}
const sellerName=o=>{ const s=sellers.find(x=>x.id===o.sellerUid); return s?s.name:(o.sellerName||"Not recorded (older orders)"); };
const riderName=o=>{ const r=riders.find(x=>x.id===o.riderUid); return r?r.name:(o.riderName||"Unknown rider"); };

// One row per entity: label, the value written out, and a bar scaled to the top value
function rank(rows,{main,sub,numbered=true,empty}){
  if(!rows.length) return `<p class="empty">${empty}</p>`;
  const max=Math.max(...rows.map(r=>r.value))||1;
  return rows.map((r,i)=>`<div class="rank"><div class="rrow"><span>${numbered?`${i+1}. `:""}${esc(r.label)}</span>
    <span class="rnum">${sub(r)}${sub(r)?" · ":""}<b>${main(r)}</b></span></div>
    <div class="track" title="${esc(r.label)}: ${esc(main(r))}"><div class="bar" style="width:${Math.max(0.5,r.value/max*100).toFixed(1)}%"></div></div></div>`).join("");
}
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

// While the owner is typing in a form, wait: a redraw would wipe what they typed.
// Updates are shown as soon as they leave the box (but not mid-tap on a button).
let renderWaiting=false;
$("#view").addEventListener("focusout",()=>setTimeout(()=>{ const a=document.activeElement;
  if(renderWaiting && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest("#view"))){ renderWaiting=false; render(); } },400));
function render(force){
  const a=document.activeElement;
  if(force!==true && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest("#view") && a.id!=="search"){ renderWaiting=true; return; }
  const done=orders.filter(isDone), sales=done.reduce((s,o)=>s+shopAmount(o),0);
  $("#sSales").textContent=peso(sales);
  $("#sOrders").textContent=done.length;
  $("#sAvg").textContent=peso(done.length?Math.round(sales/done.length):0);
  $("#sFees").textContent=peso(done.reduce((s,o)=>s+(o.deliveryFee||0),0));
  $("#sOpen").textContent=orders.filter(o=>ACTIVE.includes(o.status)).length;
  $("#sCancel").textContent=orders.filter(o=>o.status==="cancelled").length;
  const pending=sellers.filter(s=>s.status==="pending").length+kitchen.filter(k=>k.status==="pending").length+riders.filter(r=>r.status==="pending").length;
  $("#tabs").innerHTML=[["sales","Sales"],["orders","Orders",orders.length],["team","Staff & riders",pending],["reports","Reports",reports.filter(r=>r.status==="open").length],["shifts","Shifts",allShifts.filter(x=>!x.closedAt).length],["savings","Savings"],["menu","Menu"],["inventory","Inventory"],["settings","Shop settings"]]
    .map(([id,l,n])=>`<button class="${tab===id?"on":""}" data-tab="${id}">${l}${n?`<span class="count">${n}</span>`:""}</button>`).join("");
  if(tab==="sales") renderSales(done);
  else if(tab==="orders") renderOrders();
  else if(tab==="team") renderTeam();
  else if(tab==="reports") renderReports();
  else if(tab==="savings") renderSavings();
  else if(tab==="shifts") renderShifts();
  else if(tab==="menu") renderMenu();
  else if(tab==="inventory") renderInventory();
  else renderSettings();
}
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ tab=b.dataset.tab; render(); } });

function renderSales(done){
  const food=o=>shopAmount(o); // food and take-out boxes
  const bySeller=group(done,o=>o.sellerUid||"_none",sellerName,food);
  const byRider=group(done.filter(o=>o.mode==="Delivery"&&o.riderUid),o=>o.riderUid,riderName,o=>o.deliveryFee||0);
  const byMode=group(done,o=>o.mode,o=>o.mode,food);
  const byPay=group(done,o=>o.payment,o=>o.payment,food);
  const items=new Map();
  done.forEach(o=>(o.items||[]).forEach(it=>{
    const k=it.id, r=items.get(k)||{key:k,label:ITEMS[k]?.name||"Unknown item",count:0,value:0};
    r.count+=Number(it.qty)||0; r.value+=(Number(it.price)||0)*(Number(it.qty)||0); items.set(k,r);
  }));
  const topItems=[...items.values()].sort((x,y)=>y.count-x.count||y.value-x.value).slice(0,10).map(r=>({...r,value:r.count,sales:r.value}));
  // Sales over time: by hour for a single day, by day for longer ranges
  const [a,b]=rangeDates(), oneDay=b-a<=86400000, buckets=new Map();
  if(oneDay){ done.forEach(o=>{ const h=o.createdAt?.toDate?.().getHours(); if(h!=null) buckets.set(h,(buckets.get(h)||0)+food(o)); }); }
  else {
    for(let d=new Date(a); d<b; d=addDays(d,1)) buckets.set(ymd(d),0); // every day shows, even with no sales
    done.forEach(o=>{ const d=o.createdAt?.toDate?.(); if(d){ const k=ymd(d); buckets.set(k,(buckets.get(k)||0)+food(o)); } });
  }
  let time=[...buckets.entries()].map(([k,v])=>({label:oneDay?new Date(2000,0,1,k).toLocaleTimeString("en-PH",{hour:"numeric"}):new Date(k+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"}),value:v,k}));
  time.sort((x,y)=>x.k<y.k?-1:x.k>y.k?1:0);
  if(oneDay) time=time.filter(r=>r.value>0);
  const money=r=>peso(r.value);
  $("#view").innerHTML=`<div class="panels">
    <section class="card panel"><h2>Sellers</h2><p class="sub">Food sales from completed orders each seller accepted or recorded</p>
      ${rank(bySeller,{main:money,sub:r=>plural(r.count,"order"),empty:"No completed orders in this range yet."})}</section>
    <section class="card panel"><h2>Best-selling items</h2><p class="sub">Top 10 by quantity</p>
      ${rank(topItems,{main:r=>plural(r.count,"pc"),sub:r=>peso(r.sales),empty:"Nothing sold in this range yet."})}</section>
    <section class="card panel"><h2>${oneDay?"Sales by hour":"Sales by day"}</h2><p class="sub">Food sales from completed orders</p>
      ${rank(time,{main:money,sub:()=>"",numbered:false,empty:"No sales in this range yet."})}</section>
    <section class="card panel"><h2>Riders</h2><p class="sub">Delivery fees earned on completed deliveries</p>
      ${rank(byRider,{main:money,sub:r=>r.count===1?"1 delivery":`${r.count} deliveries`,empty:"No deliveries in this range yet."})}</section>
    <section class="card panel"><h2>Order type</h2><p class="sub">Food sales by delivery, pickup and dine-in</p>
      ${rank(byMode,{main:money,sub:r=>plural(r.count,"order"),numbered:false,empty:"No completed orders yet."})}</section>
    <section class="card panel"><h2>Payment</h2><p class="sub">Food sales by payment method</p>
      ${rank(byPay,{main:money,sub:r=>plural(r.count,"order"),numbered:false,empty:"No completed orders yet."})}</section>
  </div>`;
}

// ---------- Deleting orders ----------
// The owner can delete orders, e.g. test orders. Each order goes with its customer contact details
// and delivery code. Deleted orders leave the sales totals and inventory counts; it can't be undone.
const picked=new Set();
let delMsg="";
function delBar(shown){
  const ids=[...picked].filter(id=>orders.some(o=>o.id===id));
  if(!ids.length) return delMsg?`<p class="muted" style="font-size:.88rem;margin:8px 0 0">${esc(delMsg)}</p>`:"";
  const total=ids.reduce((s,id)=>s+(orders.find(o=>o.id===id)?.total||0),0);
  return `<div class="flag" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <span>${plural(ids.length,"order")} selected (${peso(total)}). Deleted orders disappear from sales and inventory and can't be brought back.</span>
    <button class="btn small" data-delpicked>Delete ${plural(ids.length,"order")}</button>
    <button class="btn ghost small" data-unpick>Clear selection</button></div>`;
}
async function deleteOrders(ids){
  for(let i=0;i<ids.length;i+=150){ // 3 writes per order, 500 per batch
    const b=writeBatch(db);
    ids.slice(i,i+150).forEach(id=>{ b.delete(doc(db,"orders",id)); b.delete(doc(db,"contacts",id)); b.delete(doc(db,"pins",id)); });
    await b.commit();
  }
}

  const s=await getDocs(query(collection(db,"orders"),where("createdAt",">=",Timestamp.fromDate(a)),where("createdAt","<",Timestamp.fromDate(b))));

}

async function showSalesHint(){

    const already=ledger.filter(e=>e.type==="saving"&&e.date===day).reduce((t,e)=>t+e.amount,0);
    hint.innerHTML=`Sales on this day: <b>${peso(total)}</b>${already?` · already saved ${peso(already)}`:""}
      ${total-already>0?` <button type="button" class="btn ghost small" id="sv-use">Use ${peso(total-already)}</button>`:total?" · all saved":""}`;

function newItemId(c){
  const used=new Set(menuRetired); [savedMenu(),menuDraft].forEach(m=>m.forEach(s=>(s.items||[]).forEach(it=>used.add(it.id))));
  const pre=(c.items.find(it=>/^[A-Z]+/.test(it.id))?.id.match(/^[A-Z]+/)[0])||(c.name.replace(/[^A-Za-z]/g,"")[0]||"X").toUpperCase();
  let n=1; used.forEach(id=>{ const m=id.match(new RegExp("^"+pre+"(\\d+)$")); if(m) n=Math.max(n,+m[1]+1); });
  let id; do{ id=pre+String(n++).padStart(2,"0"); }while(used.has(id));
  return id;

// ---------- Inventory (by ingredient) ----------
// The owner keeps a list of ingredients (egg, rice, chicken…). At the start of a shift they
// record how much of each they have. Every order placed since then (not cancelled) takes off
// what its items use (recipe × quantity), so the table shows what's left, and items whose
// ingredients run short show as sold out. Ending the shift saves the breakdown.
let counts=[], countsErr="", invView=null, invEdit=false, invDraft={}, invOrders=[], invSub=null, invKey="", invMsg="";
let ingDraft=null, ingMsg="", ingOpen=false;
const UNITS=["pcs","g","kg","ml","L","cups","packs","servings"];
const openCount=()=>counts.find(c=>!c.closedAt);
const tsDate=t=>t?.toDate?.()||null;
const when=t=>tsDate(t)?.toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short"})||"—";
const fmtQ=n=>String(Math.round(n*100)/100);
// Orders placed during a count (a finished count keeps its own saved breakdown)
function watchInv(c){
  const key=c?c.id+":"+(tsDate(c.since)?.getTime()||0)+":"+(tsDate(c.closedAt)?.getTime()||0):"";
  if(key===invKey) return; invSub?.(); invSub=null; invKey=key; invOrders=[];
  if(!c || !tsDate(c.since) || c.result) return;
  const w=[where("createdAt",">=",c.since)]; if(c.closedAt) w.push(where("createdAt","<",c.closedAt));
  invSub=onSnapshot(query(collection(db,"orders"),...w,orderBy("createdAt","desc")),
    s=>{ invOrders=s.docs.map(d=>d.data()); if(tab==="inventory") render();
      if(!c.closedAt && c.id===openCount()?.id) publishStock(ingredientsLeft(c,invOrders)); }, ()=>{});
}
// One row per counted ingredient: beginning, used, left
function breakdown(c){
  const left=c.result?null:ingredientsLeft({...c,closedAt:null},invOrders);
  return Object.keys(c.items||{}).map(id=>{
    const begin=c.items[id], l=c.result?(c.result[id]?.remaining??begin):left[id];
    return { id, name:ingName(id), unit:ingUnit(id), begin, used:Math.round((begin-l)*100)/100, left:l };
  });
}
// Publish the items that are sold out right now for the customer page (the seller dashboard
// does the same as orders come in). Only written when the list changes.
// left: what's left of each counted ingredient (null when no count is open)
let lastSoldOut="";
function publishStock(left){
  const soldOut=soldOutFrom(left), k=JSON.stringify([soldOut,left||{}]); if(k===lastSoldOut) return; lastSoldOut=k;
  setDoc(doc(db,"settings","stock"),{soldOut,left:left||{},updatedAt:serverTimestamp()}).catch(()=>{ lastSoldOut=""; });
}
const isLow=r=>r.left>0 && r.left<=r.begin*0.2;
// Ingredients the menu uses that aren't in this count: items needing them can't be sold
// while the count is open. Plus items ordered that have no ingredients set at all.
function notCounted(c){
  const have=c.items||{}, missing={};
  Object.values(ITEMS).forEach(it=>{ if(it.off) return;
    [...Object.keys(it.recipe||{}),...Object.keys(it.takeout||{})].forEach(g=>{ if(!(g in have)) (missing[g]=missing[g]||new Set()).add(it.name); }); });
  const n={};
  invOrders.filter(o=>o.status!=="cancelled").forEach(o=>(o.items||[]).forEach(it=>{
    const r=ITEMS[it.id]; if(r && !Object.keys(r.recipe||{}).length && !Object.keys(r.takeout||{}).length) n[it.id]=(n[it.id]||0)+(Number(it.qty)||0); }));
  const miss=Object.entries(missing).map(([g,names])=>`${ingName(g)} (${[...names].slice(0,4).join(", ")}${names.size>4?"…":""})`);
  const free=Object.entries(n).map(([id,q])=>`${ITEMS[id]?.name||id} ×${q}`);
  return (miss.length?`<div class="flag" style="margin-top:8px">Not in this count, so the items that need them are sold out: ${esc(miss.join("; "))}.
      Tap <b>Change beginning stock</b> to add how much you have.</div>`:"")
    +(free.length?`<div class="flag" style="margin-top:8px">Sold without counting: ${esc(free.join(", "))}. These items have no ingredients set.
      In the <b>Menu</b> tab, open <b>Ingredients</b> on each one (for drinks, tap <b>Count this item itself</b>).</div>`:"");
}
function invTable(rows){
  if(!rows.length) return `<p class="empty">No ingredients counted.</p>`;
  return `<div class="tablewrap"><table class="inv"><thead><tr><th>Ingredient</th><th class="n">Beginning</th><th class="n">Used</th><th class="n">Left</th><th class="n">To restock</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.left<=0?"out":isLow(r)?"low":""}"><td>${esc(r.name)}${r.left<=0?" · out":isLow(r)?" · low":""}</td>
      <td class="n">${fmtQ(r.begin)} ${esc(r.unit)}</td><td class="n">${fmtQ(r.used)}</td><td class="n">${fmtQ(r.left)}</td><td class="n"><b>${fmtQ(Math.max(0,r.used))} ${esc(r.unit)}</b></td></tr>`).join("")}

}

function renderInventory(){

lvInput.onchange=async()=>{
  const f=lvInput.files[0]; lvInput.value=""; if(!f) return;
  lvMsg="Reading the file…"; lvPlan=null; render(true);
  try{
    const text=await f.text(); lvLinks={};
    const r=readLoyverse(text,ITEMS);
    if(!r.orders.length){ lvMsg=r.problems[0]||"No sales found in that file."; return render(true); }
    // which receipts are already here
    const done=new Set();
    for(let i=0;i<r.orders.length;i+=25)
      await Promise.all(r.orders.slice(i,i+25).map(o=>getDoc(doc(db,"orders","loyverse-"+o.receipt)).then(s=>{ if(s.exists()) done.add(o.receipt); }).catch(()=>{})));
    lvPlan={...r,text,file:f.name,already:done,todo:r.orders.filter(o=>!done.has(o.receipt)&&o.items.length<=MAX_LINES)};
    lvMsg="";
  }catch(x){ lvMsg="Couldn't read that file: "+(x.message||friendlyError(x)); }
  render(true);
};
function lvPreview(){
  if(!lvPlan) return lvMsg?`<section class="card" style="margin-top:12px"><p style="margin:0">${esc(lvMsg)}</p></section>`:"";
  const p=lvPlan, days={}, money=o=>o.total;
  p.todo.forEach(o=>{ const d=o.when.toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"}); const x=days[d]||(days[d]={n:0,sum:0}); x.n++; x.sum+=money(o); });
  const total=p.todo.reduce((s,o)=>s+o.total,0), fees=p.todo.reduce((s,o)=>s+o.deliveryFee,0);
  const un=Object.entries(p.unmatched);
  return `<section class="card" style="margin-top:12px"><h2 style="color:var(--brand-deep)">Import from Loyverse</h2>
    <p class="muted" style="font-size:.88rem;margin:4px 0 8px">${esc(p.file)} · ${plural(p.orders.length,"receipt")} after refunds${p.refunds?` (${plural(p.refunds,"refund")} taken off the sales they refunded)`:""}.
      Each receipt is saved as a paid order on its own date and time, marked <b>Imported from Loyverse</b>. Payment is recorded as cash.</p>
    ${p.already.size?`<p style="margin:0 0 8px">${plural(p.already.size,"receipt")} were imported before and will be skipped.</p>`:""}
    ${p.todo.length?`<div class="tablewrap"><table class="inv"><thead><tr><th>Day</th><th class="n">Receipts</th><th class="n">Total</th></tr></thead><tbody>
      ${Object.entries(days).map(([d,x])=>`<tr><td>${esc(d)}</td><td class="n">${x.n}</td><td class="n">${peso(x.sum)}</td></tr>`).join("")}
      <tr class="sec"><td>All</td><td class="n">${p.todo.length}</td><td class="n">${peso(total)}</td></tr></tbody></table></div>
      ${fees?`<p class="muted" style="font-size:.85rem;margin:6px 0 0">Includes ${peso(fees)} in delivery fees, which go to riders and aren't counted in shop sales.</p>`:""}`
      :`<p class="empty">Everything in this file is already imported.</p>`}
    ${un.length?`<div class="flag" style="margin-top:8px;display:grid;gap:6px">
      <span>Not matched to your menu. Pick the menu item for each, or leave it to import with its Loyverse name and price:</span>
      ${un.map(([n,q])=>`<label style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--fg);font-weight:600">${esc(n)} ×${q}
        <select data-lvlink="${esc(n)}" style="width:auto;max-width:100%" aria-label="Menu item for ${esc(n)}">
          <option value="">Keep the Loyverse name</option>
          ${savedMenu().map(c=>`<optgroup label="${esc(c.name)}">${(c.items||[]).map(it=>`<option value="${esc(it.id)}">${esc(it.name)} (${peso(it.price)})</option>`).join("")}</optgroup>`).join("")}
        </select></label>`).join("")}</div>`:""}
    ${Object.keys(lvLinks).length?`<p class="muted" style="font-size:.85rem;margin:6px 0 0">Linked: ${esc(Object.entries(lvLinks).map(([n,id])=>`${n} → ${ITEMS[id]?.name||id}`).join(", "))}</p>`:""}
    ${p.problems.length?`<div class="flag" style="margin-top:8px">${p.problems.slice(0,5).map(esc).join("<br>")}</div>`:""}
    ${lvMsg?`<p class="err">${esc(lvMsg)}</p>`:""}
    <div class="btnrow" style="margin-top:10px">${p.todo.length?`<button class="btn" data-lvgo${lvBusy?" disabled":""}>Import ${plural(p.todo.length,"receipt")} · ${peso(total)}</button>`:""}
      <button class="btn ghost small" data-lvclose>${p.todo.length?"Cancel":"Close"}</button></div></section>`;
}
// The owner links a Loyverse item to a menu item: work the receipts out again with that link
$("#view").addEventListener("change",e=>{
  const sel=e.target.closest("[data-lvlink]"); if(!sel || tab!=="orders" || !lvPlan) return;
  if(sel.value) lvLinks[sel.dataset.lvlink]=sel.value; else delete lvLinks[sel.dataset.lvlink];
  sel.blur();
  const r=readLoyverse(lvPlan.text,ITEMS,lvLinks), done=lvPlan.already;
  lvPlan={...lvPlan,...r,todo:r.orders.filter(o=>!done.has(o.receipt)&&o.items.length<=MAX_LINES)};
  render(true);
});
$("#view").addEventListener("click",async e=>{
  if(tab!=="orders") return;
  const b=e.target.closest("[data-lvpick],[data-lvgo],[data-lvclose]"); if(!b) return;
  if(b.dataset.lvpick!==undefined){ lvMsg=""; return lvInput.click(); }
  if(b.dataset.lvclose!==undefined){ lvPlan=null; lvMsg=""; return render(true); }
  const p=lvPlan, uid=auth.currentUser.uid; lvBusy=true; b.disabled=true; b.textContent="Importing…";
  let saved=0;
  try{
    for(let i=0;i<p.todo.length;i+=400){
      const batch=writeBatch(db);
      p.todo.slice(i,i+400).forEach(o=>batch.set(doc(db,"orders","loyverse-"+o.receipt),{
        code:("LV-"+o.receipt).slice(0,20), customerUid:uid, sellerUid:uid, sellerName:"Owner", mode:o.mode, table:"", notes:"Imported from Loyverse",
        payment:"Cash", items:o.items, subtotal:o.subtotal, deliveryFee:o.deliveryFee, boxFee:o.boxFee, total:o.total, status:"completed", riderUid:null,
        createdAt:Timestamp.fromDate(o.when), manual:true, addedBy:uid, addedAt:serverTimestamp(), cashGiven:o.total, paidTotal:o.total,
        source:"loyverse", receipt:o.receipt }));
      await batch.commit(); saved+=Math.min(400,p.todo.length-i);
    }
    const first=p.todo[0].when, last=p.todo[p.todo.length-1].when;
    delMsg=`Imported ${plural(saved,"receipt")} from Loyverse (${first.toLocaleDateString("en-PH",{month:"short",day:"numeric"})} to ${last.toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})}). Pick those dates above to see them.`;
    lvPlan=null;
  }catch(x){ lvMsg=(saved?`Imported ${saved} before an error: `:"Couldn't import: ")+friendlyError(x)+" If you just updated the app, publish the new security rules in Firebase. Importing the file again skips what's already in."; }
  lvBusy=false; render(true);
});

// ---------- Shifts ----------
// Every cashier shift: who opened and closed it, its sales, and the cash expected in the drawer
// against the cash counted. Totals are saved when the shift closes.
let allShifts=[], shiftsErr="", shiftOpen=null;
function renderShifts(){
  const t=v=>v?.toDate?.()?.toLocaleString("en-PH",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})||"—";
  const diffCell=x=>{ const s=x.summary; if(!s||s.counted==null) return `<span class="muted">—</span>`; const d=s.counted-s.expected;
    return d===0?`<span class="pill go">Exact</span>`:d>0?`<span class="pill work">Over ${peso(d)}</span>`:`<span class="pill new">Short ${peso(-d)}</span>`; };
  const row=(l,v,b)=>`<div${b?' class="grand"':""}><span>${l}</span><span>${v}</span></div>`;
  const detail=x=>{ const s=x.summary;
    return `<div class="totals" style="max-width:420px">${s?row("Orders",s.orders)+row("Sales",peso(s.sales))+row("GCash received",peso(s.gcashSales))
        +(s.unpaidCount?row(`Not paid at closing (${s.unpaidCount})`,peso(s.unpaid)):"")+(s.cancelled?row("Cancelled orders",s.cancelled):"")
        +row("Starting cash",peso(s.startCash))+row("Cash sales",peso(s.cashSales))+(s.riderCash?row("Cash from riders",peso(s.riderCash)):"")
        +(s.adjustIn?row("Extra collected",peso(s.adjustIn)):"")+(s.adjustOut?row("Given back","−"+peso(s.adjustOut)):"")
        +(s.payIn?row("Pay in",peso(s.payIn)):"")+(s.payOut?row("Pay out","−"+peso(s.payOut)):"")
        +row("Expected cash",peso(s.expected),true)+row("Counted",peso(s.counted))
      :row("Starting cash",peso(x.startCash))+`<div class="muted">Still open: the totals are saved when the seller closes the shift.</div>`}</div>
      ${(x.moves||[]).length?`<b style="display:block;margin-top:8px">Pay in / pay out</b><ul class="lines">${x.moves.map(m=>`<li><span class="q">${m.type==="in"?"In":"Out"}</span><span>${esc(m.note)} · ${esc(m.byName)} · ${new Date(m.at).toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"})}</span><span class="amt">${peso(m.amount)}</span></li>`).join("")}</ul>`:""}
      <div class="btnrow" style="margin-top:8px"><button class="btn ghost small" data-shdel="${esc(x.id)}">Delete shift</button></div>`; };
  $("#view").innerHTML=`<div class="card" style="margin-top:12px">
    <h2 style="color:var(--brand-deep)">Shifts</h2>
    <p class="muted" style="font-size:.88rem;margin:4px 0 8px">Sellers open a shift with the cash in the drawer and close it by counting the drawer. Tap a shift for its details.</p>
    ${shiftsErr?`<div class="flag">${esc(shiftsErr)}</div>`:""}
    <div class="tablewrap"><table class="orders"><thead><tr><th>Opened</th><th>Closed</th><th>Cashier</th><th class="n">Orders</th><th class="n">Sales</th><th class="n">Expected cash</th><th class="n">Counted</th><th>Cash</th></tr></thead>
    <tbody>${allShifts.map(x=>`<tr class="row" data-shopen="${esc(x.id)}"><td>${t(x.openedAt)}</td><td>${x.closedAt?t(x.closedAt):`<span class="pill go">Open now</span>`}</td>
      <td>${esc(x.openedByName||"")}${x.closedByName&&x.closedByName!==x.openedByName?` → ${esc(x.closedByName)}`:""}</td>
      <td class="n">${x.summary?x.summary.orders:"—"}</td><td class="n">${x.summary?peso(x.summary.sales):"—"}</td>
      <td class="n">${x.summary?peso(x.summary.expected):"—"}</td><td class="n">${x.summary?peso(x.summary.counted):"—"}</td><td>${diffCell(x)}</td></tr>
      ${shiftOpen===x.id?`<tr class="detail"><td colspan="8">${detail(x)}</td></tr>`:""}`).join("")||`<tr><td colspan="8" class="muted">No shifts yet. Sellers open one on the seller dashboard.</td></tr>`}</tbody></table></div></div>`;
}
$("#view").addEventListener("click",async e=>{
  if(tab!=="shifts") return;
  const d=e.target.closest("[data-shdel]");
  if(d){ if(d.dataset.sure!=="1"){ d.dataset.sure="1"; d.textContent="Delete this shift for good? Tap again"; return; }
    d.disabled=true; try{ await deleteDoc(doc(db,"shifts",d.dataset.shdel)); shiftOpen=null; }catch(x){ d.disabled=false; d.textContent=friendlyError(x); } return; }
  const r=e.target.closest("[data-shopen]"); if(r){ shiftOpen=shiftOpen===r.dataset.shopen?null:r.dataset.shopen; render(); }
});
</script>
