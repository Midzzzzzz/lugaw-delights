<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lugaw Delights – New password</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="style.css">
<style>.narrow{max-width:420px}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="logo.jpg" alt="Lugaw Delights logo">
    <div class="who"><h1>New password</h1><p class="tag">Choose a new password for your account.</p></div>
  </header>
  <form class="stack card narrow" id="f" novalidate>
    <label class="f" for="p1">New password<input id="p1" type="password" autocomplete="new-password" minlength="6"></label>
    <label class="f" for="p2">Type it again<input id="p2" type="password" autocomplete="new-password" minlength="6"></label>
    <p class="err" id="err" hidden></p>
    <button class="btn" type="submit" id="go">Save new password</button>
  </form>
  <div class="card narrow" id="done" hidden><h2 style="color:var(--brand)">Password changed</h2>
    <p>Sign in with your new password in the app or on the website.</p></div>
</div>
<script type="module">
import { initializeApp } from "./fb/app.js";
import { call } from "./fb/core.js";
import { friendlyError } from "./common.js";
const $=s=>document.querySelector(s), token=location.hash.slice(1);
const err=m=>{ $("#err").textContent=m||""; $("#err").hidden=!m; };
if(!/^[0-9a-f]{64}$/.test(token)) err("This link isn't complete. Open it again from the email.");
$("#f").onsubmit=async e=>{
  e.preventDefault(); err();
  const a=$("#p1").value, b=$("#p2").value;
  if(a.length<6) return err("Use a password with at least 6 characters.");
  if(a!==b) return err("The two passwords aren't the same.");
  $("#go").disabled=true;
  try{ await call(initializeApp({}, "reset"), "auth.resetDone", { token, password: a }); $("#f").hidden=true; $("#done").hidden=false; }
  catch(x){ err(friendlyError(x)); $("#go").disabled=false; }
};
</script>
</body>
</html>
