# Same behaviour as on Netlify
ServerTokens Prod
ServerSignature Off
DirectoryIndex index.html index.php

<Directory /var/www/html>
  Options -Indexes
  AllowOverride None
</Directory>

# Pages and scripts: always check for a newer version, so updates show right away
<FilesMatch "\.(html|js|css|json)$">
  Header set Cache-Control "no-cache"
</FilesMatch>
# Pictures can be kept for a day
<FilesMatch "\.(png|jpg|jpeg|svg|webp|ico)$">
  Header set Cache-Control "public, max-age=86400"
</FilesMatch>
# Android apps download as files
<FilesMatch "\.apk$">
  Header set Content-Type "application/vnd.android.package-archive"
  Header set Content-Disposition "attachment"
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
